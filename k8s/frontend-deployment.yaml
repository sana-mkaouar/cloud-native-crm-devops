apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  namespace: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-frontend
  template:
    metadata:
      labels:
        app: crm-frontend
    spec:
      containers:
        - name: crm-frontend
          image: crm-app-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
