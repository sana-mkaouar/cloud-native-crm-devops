apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: crm-system
  labels:
    app: frontend
    component: config
    environment: production
data:
  # Environment configuration for React/Vue/Angular
  config.js: |
    window.APP_CONFIG = {
      // Application Configuration
      appName: "CRM Platform",
      appVersion: "2.0.0",
      environment: "production",
      buildDate: "2024-01-15T10:00:00Z",
      
      // API Configuration
      api: {
        baseUrl: "/api",
        timeout: 30000,
        retryAttempts: 3,
        endpoints: {
          auth: "/api/v1/auth",
          customers: "/api/v1/customers",
          reports: "/api/v1/reports",
          analytics: "/api/v1/analytics",
          notifications: "/api/v1/notifications"
        }
      },
      
      // Authentication
      auth: {
        enabled: true,
        tokenRefreshInterval: 300000, // 5 minutes
        tokenExpiryWarning: 60000, // 1 minute before expiry
        autoLogout: 3600000, // 1 hour idle timeout
        ssoEnabled: true,
        providers: ["google", "microsoft", "linkedin"]
      },
      
      // Feature Flags
      features: {
        darkMode: true,
        realTimeUpdates: true,
        offlineMode: false,
        exportToExcel: true,
        bulkActions: true,
        advancedSearch: true,
        dashboardCustomization: true,
        multiLanguage: true,
        accessibility: true
      },
      
      // UI Configuration
      ui: {
        theme: {
          primaryColor: "#3f51b5",
          secondaryColor: "#f50057",
          darkMode: false
        },
        language: {
          default: "fr",
          available: ["fr", "en", "es", "de"],
          autoDetect: true
        },
        pagination: {
          defaultPageSize: 50,
          pageSizeOptions: [10, 25, 50, 100]
        },
        notifications: {
          position: "top-right",
          duration: 5000,
          maxVisible: 5
        }
      },
      
      // Analytics
      analytics: {
        googleAnalyticsId: "UA-XXXXXXXXX-X",
        hotjarId: "0000000",
        sentryDsn: "https://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@xxxxxx.ingest.sentry.io/xxxxxx",
        logRocketId: "crm-platform/production"
      },
      
      // Performance
      performance: {
        lazyLoading: true,
        codeSplitting: true,
        cacheStrategies: {
          api: "stale-while-revalidate",
          assets: "cache-first",
          images: "lazy-load"
        },
        webWorkers: {
          enabled: true,
          count: 4
        }
      },
      
      // Error Handling
      errorHandling: {
        showUserFriendlyErrors: true,
        logToServer: true,
        autoReport: true,
        fallbackUI: true
      },
      
      // Localization
      localization: {
        dateFormat: "DD/MM/YYYY",
        timeFormat: "HH:mm",
        timezone: "Europe/Paris",
        currency: "EUR",
        numberFormat: {
          decimalSeparator: ",",
          thousandSeparator: " "
        }
      },
      
      // Integrations
      integrations: {
        googleMapsApiKey: "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
        stripePublishableKey: "pk_live_xxxxxxxxxxxxxxxxxxxxxxxx",
        recaptchaSiteKey: "6Lxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      },
      
      // Monitoring
      monitoring: {
        enabled: true,
        sampleRate: 1.0,
        performanceMonitoring: true,
        errorTracking: true,
        userBehavior: true
      }
    };
  
  # Nginx Configuration
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
      worker_connections 1024;
      use epoll;
      multi_accept on;
    }
    
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      
      # Log Format
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      
      access_log /var/log/nginx/access.log main;
      
      # Basic Settings
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      server_tokens off;
      
      # Gzip Settings
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_buffers 16 8k;
      gzip_http_version 1.1;
      gzip_min_length 256;
      gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
      
      # Security Headers
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.crm.example.com wss://ws.crm.example.com; frame-ancestors 'none';" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      
      # Rate Limiting
      limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
      limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
      
      # Cache Settings
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      
      # Include server configurations
      include /etc/nginx/conf.d/*.conf;
    }
  
  # React Environment Variables
  .env.production: |
    REACT_APP_NAME=CRM Platform
    REACT_APP_VERSION=2.0.0
    REACT_APP_ENV=production
    REACT_APP_API_URL=/api
    REACT_APP_WS_URL=wss://ws.crm.example.com
    REACT_APP_SENTRY_DSN=https://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@xxxxxx.ingest.sentry.io/xxxxxx
    REACT_APP_GA_TRACKING_ID=UA-XXXXXXXXX-X
    REACT_APP_RECAPTCHA_SITE_KEY=6Lxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    REACT_APP_STRIPE_KEY=pk_live_xxxxxxxxxxxxxxxxxxxxxxxx
    REACT_APP_MAPBOX_TOKEN=pk.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    
    # Feature Flags
    REACT_APP_FEATURE_DARK_MODE=true
    REACT_APP_FEATURE_REALTIME=true
    REACT_APP_FEATURE_OFFLINE=false
    REACT_APP_FEATURE_EXPORT=true
    REACT_APP_FEATURE_SSO=true
    
    # Performance
    REACT_APP_LAZY_LOAD=true
    REACT_APP_CODE_SPLITTING=true
    REACT_APP_PREFETCH=true
    
    # Analytics
    REACT_APP_ENABLE_ANALYTICS=true
    REACT_APP_ENABLE_PERFORMANCE_MONITORING=true
    REACT_APP_ENABLE_ERROR_TRACKING=true
  
  # Build configuration
  build-config.json: |
    {
      "build": {
        "target": "production",
        "optimize": true,
        "sourcemaps": false,
        "minify": true,
        "compress": true,
        "bundleAnalyzer": false,
        "generateManifest": true,
        "generateSW": true
      },
      "output": {
        "path": "/usr/share/nginx/html",
        "filename": "[name].[contenthash].js",
        "chunkFilename": "[name].[contenthash].chunk.js",
        "publicPath": "/",
        "clean": true
      },
      "performance": {
        "hints": "warning",
        "maxEntrypointSize": 512000,
        "maxAssetSize": 512000
      },
      "optimization": {
        "splitChunks": {
          "chunks": "all",
          "maxSize": 244000,
          "minSize": 20000
        },
        "runtimeChunk": "single"
      }
    }