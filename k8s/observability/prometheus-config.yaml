apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: crm
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scraper les métriques Dapr de customer-service
      - job_name: 'customer-service-dapr'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - crm
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: customer-service
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9090"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Scraper les métriques Dapr de auth-service
      - job_name: 'auth-service-dapr'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - crm
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: auth-service
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9090"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Prometheus lui-même
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']