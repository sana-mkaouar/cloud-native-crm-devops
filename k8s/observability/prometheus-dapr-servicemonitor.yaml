apiVersion: v1
kind: Service
metadata:
  name: customer-service-dapr-metrics
  namespace: crm
  labels:
    app: customer-service
    dapr: metrics
spec:
  selector:
    app: customer-service
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-dapr-metrics
  namespace: crm
  labels:
    app: auth-service
    dapr: metrics
spec:
  selector:
    app: auth-service
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dapr-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      dapr: metrics
  namespaceSelector:
    matchNames:
      - crm
  endpoints:
    - port: metrics
      interval: 15s
      path: /