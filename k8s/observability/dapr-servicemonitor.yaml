apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dapr-services-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      metrics: dapr
  namespaceSelector:
    matchNames:
      - crm
  endpoints:
    - port: metrics
      interval: 15s
      path: /