apiVersion: v1
kind: Service
metadata:
  name: postgres-customer
  namespace: crm-system
  labels:
    app: postgres-customer
    component: database
    tier: backend
    database: customer
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  - port: 9187
    targetPort: 9187
    protocol: TCP
    name: metrics
  selector:
    app: postgres-customer
  sessionAffinity: None
  publishNotReadyAddresses: false