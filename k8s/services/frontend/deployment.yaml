apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service-hpa
  namespace: crm-system
  labels:
    app: customer-service
    component: autoscaler
    environment: production
  annotations:
    autoscaling.alpha.kubernetes.io/conditions: '[]'
    autoscaling.alpha.kubernetes.io/current-metrics: '[]'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service
  
  minReplicas: 3
  maxReplicas: 15
  
  # Métriques pour le scaling
  metrics:
  # Métrique basée sur l'utilisation CPU
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Métrique basée sur l'utilisation mémoire
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Métrique basée sur les requêtes HTTP personnalisées
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  
  # Métrique basée sur la longueur de file d'attente
  - type: Object
    object:
      metric:
        name: queue_length
      describedObject:
        apiVersion: v1
        kind: Service
        name: customer-service
      target:
        type: Value
        value: "50"
  
  # Métrique externe (ex: depuis Prometheus)
  # - type: External
  #   external:
  #     metric:
  #       name: custom_metric
  #       selector:
  #         matchLabels:
  #           service: customer-service
  #     target:
  #       type: AverageValue
  #       averageValue: "10"
  
  # Comportement de scaling
  behavior:
    # Comportement lors du scale down
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    
    # Comportement lors du scale up
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    
    # Désactiver le scaling pendant certaines périodes
    # scaleDown:
    #   policies: []
    #   selectPolicy: Disabled
    # scaleUp:
    #   policies: []
    #   selectPolicy: Disabled